<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registration form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <div>

        <h1>Registration</h1>

        <p>First Name :<input type="text" placeholder="rose"></p>

        <p>Gender:
        male<input type="radio"> female <input type="radio"> </p>

        <br>
        <p>Phone :</p> <input type="tel" placeholder="**********">
        <br>
        <p>email :</p><input type="email" placeholder="someone@gmail.com">
        <p>Password:</p> <input type="password" placeholder="*******">
        <p>Subjects you hope to study : <br>
        Maths <input type="checkbox"> <br>
        Science <input type="checkbox"> <br>
        English <input type="checkbox"> <br>
        ICT <input type="checkbox"> </p>

        <input type="submit">

    </div>

    


</body>

</html>
